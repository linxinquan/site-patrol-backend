name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装依赖（ruff 在 dev 组里）
        run: uv sync --frozen --extra dev

      # 规则集在 pyproject.toml 的 [tool.ruff.lint] 里钉死，不依赖 ruff 各版本的默认值
      - name: ruff check
        run: uv run ruff check .

      # 暂不卡 formatter：仓库里有 3 个文件还没按 ruff format 排版，
      # 一次性重排会淹没 diff。等大家习惯后再打开这两行。
      # - name: ruff format --check
      #   run: uv run ruff format --check .

  migration:
    name: 迁移与模型漂移
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: site_patrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d site_patrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/site_patrol
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen --no-dev

      # 0001 必须能从零建起全部表 —— 交接后第一个跑 alembic 的人就是这条命令的验证者
      - name: alembic upgrade head
        run: uv run --no-dev alembic upgrade head

      # 模型改了但忘了写迁移，在这里就会红（0001 之后一律 autogenerate + 人工复核）
      - name: alembic check（模型与迁移不得有漂移）
        run: uv run --no-dev alembic check